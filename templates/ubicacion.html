    <header class="main-header">

        <section class="ubicacion">
            <div class="direccion-card">
                <address class="direccion">
                    <h3 class="direccion-title">DIRECCIÓN</h3>
                    <div class="horario-container">
                        <i class="fa-regular fa-clock" style="color: #625b55;"></i>

                </address>
                
                <div class="mapa-contenedor">
                    <iframe src="https://www.google.com/maps/embed?pb=!1m17!1m12!1m3!1d937.8008022738142!2d-70.47436700000003!3d9.448680000000007!2m3!1f0!2f0!3f0!3m2!1i1024!2i768!4f13.1!3m2!1m1!2zOcKwMjYnNTUuMyJOIDcwwrAyOCcyNy43Ilc!5e1!3m2!1ses-419!2sve!4v1791486157809!5m2!1ses-419!2sve"

                        height="450"
                        style="border:0;"
                        allowfullscreen=""
                        loading="lazy"

                        title="Mapa de Ubicación">
                    </iframe>
                </div>

                <a href="https://maps.app.goo.gl/N76AVsa2VAj8Xosm9">
                    <button class="boton-maps">Abrir en Maps</button>
                </a>
            </div>
