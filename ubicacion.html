<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Ubícanos - Panificadora Pacho's</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0-beta3/css/all.min.css">
    <link rel="icon" href="img/logo.png" type="image/x-icon">
    <!-- Enlace al CSS principal para reutilizar estilos del header y footer -->
    <link rel="stylesheet" href="css/style.css">
    <!-- Enlace al nuevo CSS específico para la página de ubicaciones -->
    <link rel="stylesheet" href="css/ubicacion.css">
</head>
<body>
    <header class="main-header">
        <nav class="navbar">
            <div class="logo">
                <img src="img/logo-pachos.png" alt="Logo" class="logo-img">
                <span class="logo-text">Panificadora<br>Pacho's</span>
            </div>
            <div class="header-right-section">
                <div class="social-icons">
                    <a href="https://www.instagram.com/panificadorapachos?igsh=MWx5c3h6djg4aTEzeQ==" target="_blank" aria-label="Instagram"><i class="fab fa-instagram"></i></a>
                    <a href="https://wa.me/+584140770512" target="_blank" aria-label="WhatsApp"><i class="fab fa-whatsapp"></i></a>
                </div>
                <div class="hamburger-menu">
                    <i class="fas fa-bars"></i>
                    <ul class="nav-links">
                        <li><a href="index.html">Página Principal</a></li>
                        <li><a href="catalogo.html">Catálogo completo de productos</a></li>
                        <li><a href="emprende.html">Emprende con nosotros</a></li>
                        <li><a href="https://wa.me/+584140770512">Contáctanos</a></li>
                    </ul>
                </div>
            </div>
        </nav>
    </header>

    <main class="main-content">
        <header class="sub-header">
            <h2 class="sub-header-text">Ubícanos cerca de ti</h2>
            <i class="fa-solid fa-location-dot"></i>
        </header>

        <section class="ubicacion">
            <div class="direccion-card">
                <address class="direccion">
                    <h3 class="direccion-title">DIRECCIÓN</h3>
                    <div class="horario-container">
                        <i class="fa-regular fa-clock" style="color: #625b55;"></i>
                        <p class="horario">Lun - Dom: 8:00 a.m. - 21:00 p.m. </p>
                    </div>
                    <p class="direccion-text">Sector "El Tendal", Pampán <br><span>Municipio Pampán, Edo. Trujillo</span></p>
                    
                </address>
                
                <div class="mapa-contenedor">
                    <iframe src="https://www.google.com/maps/embed?pb=!1m17!1m12!1m3!1d937.8008022738142!2d-70.47436700000003!3d9.448680000000007!2m3!1f0!2f0!3f0!3m2!1i1024!2i768!4f13.1!3m2!1m1!2zOcKwMjYnNTUuMyJOIDcwwrAyOCcyNy43Ilc!5e1!3m2!1ses-419!2sve!4v1791486157809!5m2!1ses-419!2sve"
                        width="450"
                        height="450"
                        style="border:0;"
                        allowfullscreen=""
                        loading="lazy"
                        referrerpolicy="strict-origin-when-cross-origin"
                        title="Mapa de Ubicación">
                    </iframe>
                </div>

                <a href="https://maps.app.goo.gl/N76AVsa2VAj8Xosm9">
                    <button class="boton-maps">Abrir en Maps</button>
                </a>
            </div>
            
        </section>

    </main>
    <script type="module" src="js/main.js"></script>
</body>
</html>
